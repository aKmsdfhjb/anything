name: Milestone 1 verification

on:
  push:
    branches: [milestone1]
  pull_request:
    branches: [milestone1]

jobs:
  static-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Run milestone acceptance checks
        run: npm run verify:phase1-2
      - name: Validate package manifest
        run: node -e "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')); console.log('package.json valid')"
      - name: Bundle Expo Android JavaScript
        run: npx expo export --platform android
